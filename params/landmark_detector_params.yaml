# landmark_detector (syncai_landmark_detection): the detector plugins and the
# landmark registry. Loaded by launch/landmark_detector.launch.py.
#
# /**/<node> so the file works under any robot_id namespace.
/**/landmark_detector:
  ros__parameters:
    use_sim_time: false
    # DetectLandmark's max_age when the caller gives <= 0 [s].
    default_max_age: 0.3
    # A detector nobody has called this long stops reading its sensor [s].
    idle_timeout: 5.0

    detector_plugins: ["ArUco"]
    ArUco:
      plugin: "syncai_landmark_detection/ArucoDetector"
      image_topic: image_raw/compressed
      camera_info_topic: camera_info
      frame_timeout: 1.0
      # Everything below is SyncAI-Robot-Charger's tuning (config/detector.yaml,
      # 2026-10); the plugin's source comments have why each value.
      corner_refine_win_px: 2
      roi_enabled: true
      roi_margin: 0.75
      roi_min_size_px: 160
      max_rz_deg: 60.0
      max_tilt_deg: 45.0
      decisive_ratio: 3.0
      decisive_margin_px: 0.3
      refine_lm: true
      refine_max_x_m: 0.6
      refine_exit_x_m: 0.65
      merge_rz_deg: 0.5
      merge_y_m: 0.003
      hint_hold_sec: 1.0
      gate_y_m: 0.302
      gate_rz_deg: 20.0
      gate_relock: 5
      gate_reset_sec: 0.5
      # The camera's exposure while this detector is awake, written through
      # syncai_camera_feeder's exposure_override_us (the feeder stays the
      # camera's one opener and writer). Auto exposure meters the whole frame
      # and stops at 8333 us; the dock's marker is 0.4 % of it and burns out
      # (robot01, 2026-11-11: 51 % of its pixels at 250+, the black border
      # gone, nothing detected). So: step through ladder_us until the marker
      # reads, steer its region's white level (the 95th percentile) to
      # target_p95, hold that exposure for the approach (a change moves the
      # corners the caller is steering on), and give the camera back at
      # standby. Every viewer of the camera sees the darker picture meanwhile.
      # A feeder that is not there (a bag replay) or stops answering costs the
      # adjustment, with a warning, never a detection.
      #
      # NONE OF THESE IS MEASURED ON THE CAMERA YET. They are reasoned from the
      # charger's experiments (camera_exposure/exposure_policy.hpp has each);
      # first to measure: how many frames a change takes to show
      # (settle_frames) and the marker's brightness against the exposure.
      exposure:
        enabled: true
        # Relative, so it resolves under the robot_id namespace.
        feeder_node: "syncai_camera_feeder"
        set_timeout: 1.0
        # Tried in order while no marker reads; the first is where every
        # wake-up starts. 8333 = 1/120 s, the charger's start; the halvings
        # for a lit marker and for sun on it; 16600 for a dark one.
        ladder_us: [8333, 4166, 2083, 1000, 16600]
        # The feeder's own clamp (one V4L2 step .. one 60 fps frame period).
        min_us: 100
        max_us: 16600
        # Frames ignored after each change, then frames without the marker
        # before the next rung: one sweep of the ladder is 40 frames, 1.3 s.
        settle_frames: 3
        miss_frames: 5
        # Locked: this many frames without the marker before searching again.
        lost_frames: 15
        target_p95: 190.0
        # Inside this band and under lock_max_saturated: locked.
        lock_p95_min: 160.0
        lock_p95_max: 220.0
        lock_max_saturated: 0.02
        # Locked, it moves again only past these, unlock_frames in a row:
        # wider than the band above, so the exposure stays still while the
        # robot walks up to the marker.
        unlock_max_saturated: 0.10
        unlock_p95_min: 100.0
        unlock_frames: 3
        # One step's largest change either way (the sensor is not linear).
        max_step: 2.0
        # The marker's quad grown by this before it is metered, to take in
        # the print's white rim, which burns out first.
        region_scale: 1.25
        saturated_level: 250

    # The registry. A landmark names its detector and carries that detector's
    # parameters for it; a second dock is a second entry.
    landmarks: ["charger_a"]
    # The charging dock's print, as SyncAI-Robot-Charger docks to it
    # (config/detector.yaml, 2026-10): marker 42 of DICT_6X6_250, an ordinary
    # print. marker_size is the print's real side, black border outer edge:
    # 0.088 there (2026-10-06, with the fisheye calibration; an 85 mm print was
    # being compared). A different print: measure it, a wrong size is a wrong
    # distance with no error.
    charger_a:
      detector: "ArUco"
      dictionary: "DICT_6X6_250"
      marker_id: 42
      marker_size: 0.088
      marker_inverted: false
