# CI for syncai_landmark_detection (the SyncAI-Robot-Landmark-Detection repo).
#
# The package can only be compiled against ROS 2 Humble plus OpenCV's contrib module (cv::aruco),
# so the `check` job builds the repo's own Dev Container image (.devcontainer/Dockerfile) with
# buildx and runs .github/scripts/ci.sh inside it. The image layers are kept in the GitHub Actions
# cache, so later runs reuse them until the Dockerfile changes or the cache entry is evicted.
#
# `format` runs on the bare runner: clang-format needs no ROS, so it answers in well under a minute.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    # 22.04, not ubuntu-latest: its apt clang-format is 14, the same one the Dev Container image
    # (Ubuntu 22.04 based) installs, so CI and developers format identically.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-format
      - run: |
          # -r: no C++ files yet must not run clang-format on stdin
          find include src test -name '*.hpp' -o -name '*.h' -o -name '*.cpp' \
            | xargs -r clang-format --dry-run --Werror

  check:
    name: colcon build / test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The same layout as the Dev Container: a colcon workspace with this repo at
      # src/syncai_landmark_detection and dependencies.repos vcs-imported next to it.
      - uses: actions/checkout@v7
        with:
          path: src/syncai_landmark_detection

      - uses: docker/setup-buildx-action@v4

      - name: Build the Dev Container image
        uses: docker/build-push-action@v7
        with:
          context: src/syncai_landmark_detection/.devcontainer
          build-args: |
            ROS_DISTRO=humble
            INSTALL_CLAUDE_CODE=false
          load: true
          tags: syncai-robot-landmark-detection-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image runs as `ros` (uid 1000) and the runner as uid 1001; the container has to be
      # able to write build/ install/ log/ into the bind-mounted workspace.
      - name: Hand the workspace to the container user
        run: sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"

      # ROS_DOMAIN_ID=77 so a test that initialises rcl can never join a real graph (the runner
      # has none, but the habit is the point). RMW_IMPLEMENTATION matches devcontainer.json.
      - name: Build and test inside the container
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --env ROS_DOMAIN_ID=77 \
            --env RMW_IMPLEMENTATION=rmw_cyclonedds_cpp \
            syncai-robot-landmark-detection-ci:latest \
            bash /workspace/src/syncai_landmark_detection/.github/scripts/ci.sh

      # Give the files back so the checkout post-step can clean up.
      - name: Hand the workspace back to the runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
